<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect x="0" y="0" width="900" height="380" rx="10" fill="#161b22"/>
  <rect x="0" y="0" width="900" height="34" rx="10" fill="#21262d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-size="12">terraform — environments/prod</text>

  <g fill="#c9d1d9" font-size="13">
    <text x="20" y="60" fill="#58a6ff">$ terraform plan -var-file="prod.tfvars"</text>
    <text x="20" y="86" fill="#8b949e">Initializing the backend... (S3 + DynamoDB lock: platform-terraform-state)</text>
    <text x="20" y="106" fill="#8b949e">Refreshing Terraform state in-memory prior to plan...</text>

    <text x="20" y="140" fill="#3fb950">+ module.vpc.aws_vpc.this will be created</text>
    <text x="20" y="160" fill="#3fb950">+ module.eks.aws_eks_cluster.this will be created</text>
    <text x="20" y="180" fill="#3fb950">+ module.rds.aws_db_instance.postgres will be created</text>
    <text x="20" y="200" fill="#d29922">~ module.security_groups.aws_security_group.alb will be updated in-place</text>
    <text x="20" y="220" fill="#3fb950">+ module.s3.aws_s3_bucket.assets will be created</text>
    <text x="20" y="240" fill="#3fb950">+ module.route53.aws_route53_record.api will be created</text>

    <text x="20" y="276" font-weight="bold" fill="#e6edf3">Plan: 24 to add, 3 to change, 0 to destroy.</text>
    <text x="20" y="300" fill="#8b949e">Saved the plan to: tfplan-prod-2024.out</text>
    <text x="20" y="322" fill="#8b949e">To perform exactly these actions, run:</text>
    <text x="20" y="342" fill="#58a6ff">terraform apply "tfplan-prod-2024.out"</text>
    <text x="20" y="366" fill="#484f58">✔ Awaiting required review before apply (CODEOWNERS)</text>
  </g>
</svg>
