<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="260" fill="#0b1220"/>
  <text x="450" y="30" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700">GitOps Pipeline — Terraform via GitHub Actions</text>

  <g font-size="13" fill="white">
    <rect x="20"  y="90" width="130" height="60" rx="10" fill="#334155"/>
    <text x="85" y="115" text-anchor="middle">Git Push</text>
    <text x="85" y="133" text-anchor="middle" font-size="10" fill="#cbd5e1">feature/* branch</text>

    <rect x="180" y="90" width="150" height="60" rx="10" fill="#1d4ed8"/>
    <text x="255" y="115" text-anchor="middle">Terraform Plan</text>
    <text x="255" y="133" text-anchor="middle" font-size="10" fill="#dbeafe">GitHub Actions</text>

    <rect x="360" y="90" width="150" height="60" rx="10" fill="#7e22ce"/>
    <text x="435" y="115" text-anchor="middle">Code Review</text>
    <text x="435" y="133" text-anchor="middle" font-size="10" fill="#f3e8ff">Pull Request + plan comment</text>

    <rect x="540" y="90" width="160" height="60" rx="10" fill="#b45309"/>
    <text x="620" y="115" text-anchor="middle">Terraform Apply</text>
    <text x="620" y="133" text-anchor="middle" font-size="10" fill="#fef3c7">on merge to main</text>

    <rect x="730" y="90" width="150" height="60" rx="10" fill="#15803d"/>
    <text x="805" y="115" text-anchor="middle">Infra Updated</text>
    <text x="805" y="133" text-anchor="middle" font-size="10" fill="#dcfce7">dev / staging / prod</text>
  </g>

  <line x1="150" y1="120" x2="180" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="330" y1="120" x2="360" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="510" y1="120" x2="540" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="700" y1="120" x2="730" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="450" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">
    Manual approval gate protects prod · terraform fmt/validate/tflint run on every PR · state locked via DynamoDB
  </text>
  <text x="450" y="222" text-anchor="middle" fill="#64748b" font-size="10">
    workflow file: .github/workflows/terraform.yml
  </text>
</svg>
